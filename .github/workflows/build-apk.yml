name: Build EvilRelay APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install System Gradle
        run: sudo apt-get update && sudo apt-get install -y gradle

      - name: Generate Wrapper and Build APK
        run: |
          cd EvilRelayAPK
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EvilRelay-Debug-APK
          path: EvilRelayAPK/build/outputs/apk/debug/*.apk
