name: Build EvilRelay APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download and Build with Gradle 8.5
        run: |
          cd EvilRelayAPK
          # Download Gradle 8.5 binary directly
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          export PATH=$PWD/gradle-8.5/bin:$PATH
          
          # Build using the explicit Gradle 8.5 binary
          gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EvilRelay-Debug-APK
          path: EvilRelayAPK/build/outputs/apk/debug/*.apk
